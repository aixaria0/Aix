# SwiftLint Configuration for Quantum ML Game

# Paths to include/exclude
included:
  - ios-app/QuantumMLGame

excluded:
  - Pods
  - .build
  - build

# Enabled rules
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - sorted_imports
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Disabled rules
disabled_rules:
  - trailing_comma
  - todo

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 60
  excluded:
    - i
    - j
    - x
    - y
    - z
    - id

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: 'print\('
    message: "Use proper logging instead of print()"
    severity: warning
