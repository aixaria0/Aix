name: VQE-PHARMACY CI

on:
  push:
    paths:
      - "vqe_pharmacy/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "vqe_pharmacy/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev gfortran
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
      
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=vqe_pharmacy --cov-report=term --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
  
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy
      
      - name: Check formatting with black
        run: |
          black --check vqe_pharmacy/ tests/
      
      - name: Lint with flake8
        run: |
          flake8 vqe_pharmacy/ tests/ --max-line-length=100 --ignore=E203,W503
      
      - name: Type check with mypy
        run: |
          mypy vqe_pharmacy/ --ignore-missing-imports
        continue-on-error: true
  
  examples:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev gfortran
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run H2 benchmark example
        run: |
          python -m vqe_pharmacy.examples.h2_benchmark
        continue-on-error: true
      
      - name: Test example imports
        run: |
          python -c "from vqe_pharmacy import VQEWorkflow; print('VQEWorkflow imported successfully')"
          python -c "from vqe_pharmacy.drivers import create_molecule; print('Drivers imported successfully')"
          python -c "from vqe_pharmacy.mappers import QubitMapper; print('Mappers imported successfully')"
